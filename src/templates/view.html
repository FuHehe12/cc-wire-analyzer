<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API 浏览面 · CC Wire Analyzer</title>
<!--
  API 浏览面（issue 260825）。本工具是双模式的：人看 `/`，AI 走 `/api/*`。
  这个页面是**给人看 AI 那一侧**的——把 JSON / Markdown 渲染成能读的东西。

  两条铁律写在这份模板里，改的时候别破：
    ① 数据一律 textContent，**零 innerHTML**。渲染的是录制下来的上游/模型输出，
       是攻击者可控文本。唯一的例外是 `/api/ai-guide`（自家文档），走 marked+DOMPurify。
    ② 折叠可以，**静默截断不行**。任何一处省略都必须带上"总共多少、点这里看全"。
       这个项目的惯犯 bug ③ 就是静默留空，在一个专门用来看清楚的页面上重犯它最讽刺。
-->
<script>
/* 跟随主界面的外观选择，避免从 `/` 点过来时闪切。cookie 跨动态端口，localStorage 兜底。
   **三套，与主界面一一对应**（260827）。此前这里把三套折成深/浅两套，折的方式还有一处错位：
   主界面选「实验室日光」（青蓝）时，浏览面拿的是「经典暖灰」的色板——不是少一套，是张冠李戴。
   外观不是装饰，它是"我还在同一个软件里"的连续性信号；而这一页偏偏是拿来核对事实的。
   属性名也用 `data-theme`，与主界面同名同值，省掉一层翻译。 */
(function(){
  const allowed = new Set(["classic", "dark", "light"]);
  let t = "";
  try{
    const m = document.cookie.match(/(?:^|;\s*)ccwa_ui_theme=([^;]+)/);
    t = m ? decodeURIComponent(m[1]) : localStorage.getItem("ccwa_ui_theme") || "";
  }catch(e){}
  if(!allowed.has(t)) t = "dark";
  document.documentElement.dataset.theme = t;
  document.documentElement.style.colorScheme = t === "dark" ? "dark" : "light";
})();
</script>
<style>
@font-face{font-family:'Inter';src:url('/static/fonts/Inter.ttf') format('truetype');font-weight:100 900;font-display:swap;}
@font-face{font-family:'JetBrains Mono';src:url('/static/fonts/JetBrainsMono.ttf') format('truetype');font-weight:100 800;font-display:swap;}
@font-face{font-family:'Noto Sans SC';src:url('/static/fonts/NotoSansSC.ttf') format('truetype');font-weight:100 900;font-display:swap;}

:root{
  --font-body:"Inter","Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-mono:"JetBrains Mono","SF Mono","Menlo","Courier New",monospace;
  /* 深色：与主界面 260802 改版同源（深炭 + 驼金发光） */
  --accent:#E8B855; --accent-deep:#C2882B; --accent-contrast:#211706;
  --bg:#131318; --card:#1E1E26; --soft:#25252F; --softer:#2A2A35;
  /* 文字三档与主界面同源（--text-tertiary / --text-faint）。260827 走查：原来的
     --faint:#74747F 压在卡片上只有 3.58:1，而它正是 `.ep-why` / `.hint` / `.empty`
     这些小字用的颜色——这一页此前从没被走查过。 */
  --text:#F5F5F7; --text-2:#C8C8D0; --dim:#A8A8B2; --faint:#9797A0;
  /* --accent 用于实底与边框，压字的那一档单列 --link（深色下两者同值，浅色下必须分开：
     亮金实底配白字 2.94:1，这条教训 index.html 已经吃过一次，别在这里重犯）。 */
  --link:#E8B855;
  --border:#2E2E38; --border-soft:#262630;
  --ok:#4ADE80; --err:#F87171; --warn:#FBBF24; --info:#60A5FA;
  --str:#9BD1A0; --num:#F0B86E; --bool:#7FB2F0; --null:#9494A0; --key:#E8B855;
  --shadow-sm:0 1px 2px rgba(0,0,0,.40),0 2px 6px rgba(0,0,0,.30);
  --shadow:0 8px 24px rgba(0,0,0,.45),0 2px 8px rgba(0,0,0,.30);
  --highlight:inset 0 1px 0 rgba(255,255,255,.08);
  --code-bg:rgba(0,0,0,.30);
}
/* 经典暖灰：与 index.html 的 html[data-theme="classic"] 同源，色值逐个抄过来。
   **不另调一套近似色**——两处各调各的就是下一次分叉。 */
html[data-theme="classic"]{
  --accent:#C98A25; --accent-deep:#A16812; --accent-contrast:#FFFFFF; --link:#6B4A12;
  --bg:#DED8CC; --card:#FFFFFF; --soft:#F4F2EF; --softer:#FBFAF8;
  --text:#1A1A1A; --text-2:#5C564C; --dim:#655F55; --faint:#686053;
  --border:#E1DBD0; --border-soft:#EDE7DC;
  --ok:#356A2B; --err:#A83C2A; --warn:#7B5B1D; --info:#315F9D;
  --str:#2E6B3A; --num:#8A5A12; --bool:#2A5C99; --null:#686053; --key:#8A5F14;
  --shadow-sm:0 1px 3px rgba(45,35,20,.07);
  --shadow:0 3px 12px rgba(45,35,20,.10);
  --highlight:inset 0 1px 0 rgba(255,255,255,.78);
  --code-bg:rgba(0,0,0,.05);
}
/* 实验室日光：冷矿物纸面 + 精密青蓝。JSON 语法高亮那五个色也各给一份——
   一组色值不可能同时落在 #131318 和 #E8EEF0 上还都过 AA，这是 v0.4.16 全站走查
   留下的规矩，换个文件不等于不算数。 */
html[data-theme="light"]{
  --accent:#1E6972; --accent-deep:#15545B; --accent-contrast:#FFFFFF; --link:#185A62;
  --bg:#E8EEF0; --card:#FFFFFF; --soft:#EDF3F5; --softer:#F7FAFB;
  --text:#17212B; --text-2:#3D4C57; --dim:#485964; --faint:#55646D;
  --border:#C7D4D9; --border-soft:#DEE7EA;
  --ok:#237A53; --err:#A93635; --warn:#7A5B13; --info:#2A64A1;
  --str:#1F6B45; --num:#8A5A12; --bool:#2A64A1; --null:#55646D; --key:#185A62;
  --shadow-sm:0 1px 3px rgba(31,57,66,.10),0 1px 2px rgba(31,57,66,.06);
  --shadow:0 8px 22px rgba(31,57,66,.11),0 2px 6px rgba(31,57,66,.07);
  --highlight:inset 0 1px 0 rgba(255,255,255,.88);
  --code-bg:rgba(31,57,66,.06);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;}
a{color:var(--link);text-decoration:none;}
a:hover{text-decoration:underline;}
code,pre,.mono{font-family:var(--font-mono);}

/* ---- 顶栏 ---- */
header{position:sticky;top:0;z-index:10;background:var(--card);
  border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);}
.bar{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;
  gap:14px;flex-wrap:wrap;}
.brand{font-weight:700;font-size:15px;letter-spacing:.2px;white-space:nowrap;}
.brand .dot{color:var(--link);}
.bar .sp{flex:1;}
.rt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
/* 外观开关：写的是**同一对** cookie + localStorage 键（ccwa_ui_theme），所以它不是第二个
   真相源，只是同一个设置的第二个入口——`/view` 能被直接敲 URL 打开（用户就是这么打开的），
   而改外观的开关此前只长在主界面设置页里，第一次进来的人拿到深色就换不掉。
   三块色板的取值与 index.html 设置页的 .theme-swatch 同源。 */
.tsw{display:flex;gap:5px;align-items:center;}
.tsw button{width:28px;height:21px;padding:0;border-radius:6px;cursor:pointer;
  border:1px solid var(--border);position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.32);transition:box-shadow .14s ease;}
.tsw button::before{content:"";position:absolute;left:4px;right:4px;top:4px;height:4px;
  border-radius:2px;background:var(--sw-card);}
.tsw button::after{content:"";position:absolute;left:4px;bottom:4px;width:11px;height:4px;
  border-radius:2px;background:var(--sw-accent);}
.tsw button[aria-checked="true"]{border-color:var(--accent);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent);}
.tsw button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.tsw button[data-t="classic"]{background:#DED8CC;--sw-card:#FFFFFF;--sw-accent:#C98A25;}
.tsw button[data-t="dark"]{background:#131318;--sw-card:#2A2A35;--sw-accent:#E8B855;}
.tsw button[data-t="light"]{background:#E8EEF0;--sw-card:#FFFFFF;--sw-accent:#1E6972;}

/* ---- 通用件 ---- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
  font-size:11.5px;font-weight:600;border:1px solid var(--border);background:var(--soft);
  color:var(--text-2);white-space:nowrap;}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);}
.chip.err{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent);}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);}
.chip.gold{color:var(--link);border-color:var(--accent-deep);
  background:color-mix(in srgb,var(--accent) 12%,transparent);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:8px;
  border:1px solid var(--border);background:var(--soft);color:var(--text-2);
  font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
  transition:all .16s ease;box-shadow:var(--shadow-sm),var(--highlight);}
.btn:hover{background:var(--softer);color:var(--text);border-color:var(--faint);}
.btn.primary{background:var(--accent);border-color:var(--accent-deep);color:var(--accent-contrast);}
.btn.primary:hover{background:var(--accent-deep);color:var(--accent-contrast);}
/* 两套浅色下实底走 --accent-deep 而不是 --accent（亮金实底配白字实测 2.94:1）。
   与 index.html 同一条判据：--accent 留给边框与线条，--accent-deep 才是"上面要压字"的那一档。 */
html[data-theme="classic"] .btn.primary,html[data-theme="light"] .btn.primary{
  background:var(--accent-deep);border-color:var(--accent-deep);color:var(--accent-contrast);}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
main{max-width:1180px;margin:0 auto;padding:22px 20px 80px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  box-shadow:var(--shadow),var(--highlight);margin-bottom:18px;overflow:hidden;}
.card > h2{margin:0;padding:13px 18px;font-size:13px;font-weight:700;letter-spacing:.4px;
  text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--border-soft);
  background:var(--soft);}
.card-body{padding:14px 18px;}
.lead{color:var(--text-2);margin:0 0 16px;max-width:70ch;}
.lead b{color:var(--text);}

/* ---- 首页：端点清单 ---- */
.ep{display:grid;grid-template-columns:minmax(220px,auto) 1fr auto;gap:10px 16px;
  align-items:center;padding:9px 18px;border-bottom:1px solid var(--border-soft);}
.ep:last-child{border-bottom:none;}
.ep:hover{background:var(--soft);}
.ep-rule{font-family:var(--font-mono);font-size:12.5px;color:var(--text);word-break:break-all;}
.ep-note{color:var(--dim);font-size:12.5px;}
.ep-act{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;}
.ep.muted .ep-rule{color:var(--faint);}
.ep-why{font-size:11.5px;color:var(--faint);font-style:italic;white-space:nowrap;}
/* 需要参数的端点：一行可编辑的、**照抄就能跑**的完整 URL（issue 260827）。
   此前这些行只写一句"需路径参数"就没了下文——而 agent 读得最多的恰恰就是它们
   （`/api/captures/<rid>`、`/api/snapshots/<sid>/*`），浏览面在自己最该说清楚的地方哑了。 */
.ep-try{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:3px;}
.ep-url{flex:1;min-width:240px;font-family:var(--font-mono);font-size:12.5px;
  padding:6px 10px;border-radius:8px;border:1px solid var(--border);
  background:var(--soft);color:var(--text);}
.ep-url:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 32%,transparent);}
@media(max-width:720px){
  .ep{grid-template-columns:1fr;gap:4px;}
  .ep-act{justify-content:flex-start;}
}

/* ---- payload 顶部工具条 ---- */
.tool{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;
  background:var(--soft);border-bottom:1px solid var(--border-soft);}
.tool .url{font-family:var(--font-mono);font-size:12.5px;color:var(--text);
  word-break:break-all;flex:1;min-width:240px;}

/* ---- JSON 树 ---- */
.tree{padding:14px 18px;}
details.node{margin:1px 0;}
details.node > summary{cursor:pointer;padding:3px 6px;border-radius:6px;list-style:none;
  display:flex;align-items:center;gap:8px;user-select:none;}
details.node > summary::-webkit-details-marker{display:none;}
details.node > summary:before{content:"▸";color:var(--faint);font-size:11px;
  transition:transform .14s ease;display:inline-block;width:10px;}
details.node[open] > summary:before{transform:rotate(90deg);}
details.node > summary:hover{background:var(--soft);}
.k{color:var(--key);font-family:var(--font-mono);font-size:12.5px;font-weight:600;}
.hint{color:var(--faint);font-size:11.5px;}
.body{padding-left:16px;border-left:1px solid var(--border-soft);margin-left:5px;}
.kv{display:flex;gap:10px;align-items:flex-start;padding:2px 6px 2px 22px;flex-wrap:wrap;}
.kv > .k{flex:0 0 auto;}
.v-null{color:var(--null);font-style:italic;font-family:var(--font-mono);font-size:12.5px;}
.v-bool{color:var(--bool);font-family:var(--font-mono);font-size:12.5px;}
.v-num{color:var(--num);font-family:var(--font-mono);font-size:12.5px;}
.v-str{flex:1;min-width:0;}
.str-pre{margin:0;font-family:var(--font-mono);font-size:12.5px;color:var(--str);
  white-space:pre-wrap;word-break:break-word;background:var(--code-bg);
  padding:5px 9px;border-radius:7px;max-width:100%;}
.str-1{background:none;padding:1px 0;}
.fold-row{display:flex;gap:7px;margin-top:5px;flex-wrap:wrap;}
.fold-btn{padding:2px 9px;font-size:11.5px;border-radius:6px;border:1px solid var(--border);
  background:var(--soft);color:var(--dim);font-family:inherit;cursor:pointer;font-weight:600;}
.fold-btn:hover{color:var(--text);border-color:var(--faint);}
.empty{color:var(--faint);font-family:var(--font-mono);font-size:12.5px;}

/* ---- 数组转表 ---- */
.tbl-wrap{overflow-x:auto;margin:4px 0 4px 22px;border:1px solid var(--border-soft);
  border-radius:9px;}
table.tbl{border-collapse:collapse;width:100%;font-size:12px;}
table.tbl th{position:sticky;top:0;background:var(--softer);color:var(--dim);
  text-align:left;padding:7px 10px;font-family:var(--font-mono);font-weight:700;
  border-bottom:1px solid var(--border);white-space:nowrap;}
table.tbl td{padding:6px 10px;border-bottom:1px solid var(--border-soft);
  vertical-align:top;max-width:420px;}
table.tbl tr:last-child td{border-bottom:none;}
table.tbl tr:hover td{background:var(--soft);}
.cell-str{font-family:var(--font-mono);color:var(--str);white-space:pre-wrap;
  word-break:break-word;}

/* ---- 提示卡 ---- */
.notice{margin:0;padding:14px 18px;background:color-mix(in srgb,var(--warn) 10%,transparent);
  border-left:3px solid var(--warn);}
.notice b{color:var(--warn);}
.notice p{margin:6px 0 0;color:var(--text-2);}

/* ---- markdown ---- */
.md{padding:8px 26px 30px;max-width:82ch;}
.md h1{font-size:24px;margin:22px 0 12px;padding-bottom:9px;border-bottom:2px solid var(--accent-deep);}
.md h2{font-size:19px;margin:28px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.md h3{font-size:16px;margin:22px 0 8px;color:var(--link);}
.md h4{font-size:14px;margin:18px 0 6px;color:var(--text-2);}
.md p,.md li{color:var(--text-2);}
.md code{background:var(--code-bg);padding:1.5px 5px;border-radius:5px;font-size:12.5px;color:var(--link);}
.md pre{background:var(--code-bg);padding:12px 14px;border-radius:9px;overflow-x:auto;
  border:1px solid var(--border-soft);}
.md pre code{background:none;padding:0;color:var(--text-2);}
.md table{border-collapse:collapse;width:100%;margin:12px 0;font-size:13px;display:block;overflow-x:auto;}
.md th,.md td{border:1px solid var(--border);padding:6px 10px;text-align:left;}
.md th{background:var(--soft);color:var(--text);}
.md blockquote{margin:12px 0;padding:6px 14px;border-left:3px solid var(--accent-deep);
  background:var(--soft);border-radius:0 8px 8px 0;color:var(--text-2);}
.md hr{border:none;border-top:1px solid var(--border);margin:24px 0;}
.md a{word-break:break-all;}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);
  background:var(--text);color:var(--bg);padding:9px 18px;border-radius:10px;font-size:13px;
  font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:all .2s ease;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">CC Wire Analyzer <span class="dot">·</span> <span id="hTitle"></span></span>
    <span class="sp"></span>
    <span class="rt" id="rt"></span>
    <span class="tsw" id="tsw" role="radiogroup"></span>
    <a class="btn" href="/view" id="bHome"></a>
    <a class="btn" href="/" id="bApp"></a>
  </div>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>

<script id="meta" type="application/json">{{ meta|safe }}</script>
<script id="payload" type="application/json">{{ payload|safe }}</script>
<script id="runtime" type="application/json">{{ runtime|safe }}</script>
<script id="endpoints" type="application/json">{{ endpoints|safe }}</script>
<script src="/static/marked.min.js"></script>
<script src="/static/purify.min.js"></script>
<script>
"use strict";
/* 服务端事实。四份都走 `<script type="application/json">` + 服务端 `<` 转义，
   形式统一 —— 也让自测能把它们直接 json.loads 出来核对（view_selftest [2][7]）。 */
const META = JSON.parse(document.getElementById("meta").textContent);
const PAYLOAD = JSON.parse(document.getElementById("payload").textContent);
const RUNTIME = JSON.parse(document.getElementById("runtime").textContent);
const ENDPOINTS = JSON.parse(document.getElementById("endpoints").textContent);

/* ===== 三语。文案很少，页面自带字典，不并进 index.html 的 i18n 体系——
   tools/check_i18n_js.py 只扫 index.html，把两套键混在一起反而会让那道闸门看漏。 ===== */
const I18N = {
zh:{
  titleIndex:"API 浏览面", titleView:"API 响应",
  home:"浏览面", app:"主界面", recOn:"正在录制", recOff:"未录制",
  thPick:"外观", thClassic:"经典暖灰", thDark:"深色专业", thLight:"实验室日光",
  exReal:"本机真实数据", exFake:"参考写法（本机还没有这类数据）",
  epUrl:"请求地址（可改）", epEmpty:"地址是空的，先填一个",
  lead:"本工具是双模式的：<b>人看主界面，AI 走 HTTP API</b>。这一页把 AI 那一侧能拿到的东西原样渲染出来，"+
       "让你能亲眼核对——你复制给 agent 的那句话背后，它究竟读到了什么。"+
       "<br>页面只做呈现，<b>不改变 API 本身</b>：不带 <code>?format=html</code> 时，响应逐字节不变。",
  gRender:"渲染", gRaw:"原始 JSON", gNeedArg:"需路径参数", copy:"复制", copied:"已复制",
  copyFail:"复制失败", expandAll:"全部展开", collapseAll:"全部折叠",
  expand:"展开全文（{n} 字符）", collapse:"收起", chars:"{n} 字符",
  bytes:"{n}", keys:"{n} 键", items:"{n} 项", emptyObj:"空对象 {}", emptyArr:"空数组 []",

const L = I18N[META.lang] || I18N.zh;
const T = (k, o) => {
  let s = L[k] != null ? L[k] : k;
  if(o) for(const kk in o) s = s.split("{" + kk + "}").join(o[kk]);
  return s;
};

/* ===== DOM 小工具。**data 一律走 textContent** —— 渲染的是录制下来的上游输出，
   是攻击者可控文本。这份文件里唯一允许 innerHTML 的地方是自家文案（L.lead）与
   经 DOMPurify 消毒的 ai-guide markdown，两处都有注释标注。 ===== */
function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function fmtN(n){ return n.toLocaleString("en-US"); }
function fmtBytes(n){
  if(n < 1024) return n + " B";
  if(n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(2) + " MB";
}
let toastT = null;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1800);
}
function copyText(s){
  /* 与主界面同策：不依赖 navigator.clipboard（WebView2/WebKit 下不一定给），
     失败就退回 execCommand，再失败如实说失败——不假装成功。 */
  const done = () => toast(T("copied"));
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(s).then(done, () => fallback(s, done));
  }else fallback(s, done);
}
function fallback(s, done){
  try{
    const ta = document.createElement("textarea");
    ta.value = s; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    ok ? done() : toast(T("copyFail"));
  }catch(e){ toast(T("copyFail")); }
}

/* ===== JSON 渲染 ===== */
const STR_FOLD = 400;      /* 超过就折叠——但**必须**给出「展开全文（N 字符）」 */
const CELL_FOLD = 140;     /* 表格单元格更窄，同样必须可展开 */
/* 列太多就退回列表。**绝不砍列**——砍列就是静默丢字段。上限定得高（表格容器本来就
   横向滚动，35 列的 /api/captures 照样能读），只挡住真正病态的形状；一旦退回，
   页面上要写明"为什么不是表格"，否则这个退化本身就成了没人看得见的行为变化。 */
const TABLE_MAX_COLS = 40;

function isPlainObj(v){ return v !== null && typeof v === "object" && !Array.isArray(v); }

function foldable(s, limit, cls){
  /* 长文本折叠件。短版 + 全文各一份 DOM，切换 hidden——不做字符串拼接，
     避免在任何一处不小心走到 innerHTML。 */
  const wrap = el("div", "v-str");
  if(s.length <= limit){
    wrap.appendChild(el("pre", "str-pre " + (cls || "") + (s.indexOf("\n") < 0 ? " str-1" : ""), s));
    return wrap;
  }
  const short = el("pre", "str-pre " + (cls || ""), s.slice(0, limit) + "…");
  const full = el("pre", "str-pre " + (cls || ""), s);
  full.hidden = true;
  const btn = el("button", "fold-btn", T("expand", {n: fmtN(s.length)}));
  btn.onclick = () => {
    const open = !full.hidden;
    full.hidden = open; short.hidden = !open;
    btn.textContent = open ? T("expand", {n: fmtN(s.length)}) : T("collapse");
  };
  const cp = el("button", "fold-btn", T("copy"));
  cp.onclick = () => copyText(s);
  const row = el("div", "fold-row");
  row.appendChild(btn); row.appendChild(cp);
  wrap.appendChild(short); wrap.appendChild(full); wrap.appendChild(row);
  return wrap;
}

function renderScalar(v){
  if(v === null) return el("span", "v-null", "null");
  const t = typeof v;
  if(t === "boolean") return el("span", "v-bool", String(v));
  if(t === "number") return el("span", "v-num", String(v));
  return null;
}

function renderValue(v, depth){
  const s = renderScalar(v);
  if(s) return s;
  if(typeof v === "string") return foldable(v, STR_FOLD);
  if(Array.isArray(v)) return renderArray(v, depth);
  return renderObject(v, depth);
}

function summaryFor(key, v){
  const sum = el("summary");
  sum.appendChild(el("span", "k", key));
  if(Array.isArray(v)) sum.appendChild(el("span", "hint", T("items", {n: fmtN(v.length)})));
  else sum.appendChild(el("span", "hint", T("keys", {n: Object.keys(v).length})));
  return sum;
}

function renderObject(o, depth){
  const keys = Object.keys(o);
  if(!keys.length) return el("span", "empty", T("emptyObj"));
  const box = el("div", "body");
  for(const k of keys){
    const v = o[k];
    const isBox = (v !== null && typeof v === "object" &&
                   (Array.isArray(v) ? v.length : Object.keys(v).length) > 0);
    if(isBox){
      const d = el("details", "node");
      d.open = depth < 1;                       /* 顶两层默认展开，再深就得自己点 */
      d.appendChild(summaryFor(k, v));
      d.appendChild(renderValue(v, depth + 1));
      box.appendChild(d);
    }else{
      const row = el("div", "kv");
      row.appendChild(el("span", "k", k));
      row.appendChild(renderValue(v, depth + 1));
      box.appendChild(row);
    }
  }
  return box;
}

function tableKeys(arr){
  /* 能转表的条件：至少两个元素、全是普通对象、并集列数不超过上限。
     取**并集**而不是第一个元素的键——按第一个取会把后面元素独有的字段整列吃掉，
     那就是静默丢数据。返回 {cols} 或 {tooMany:N}，让调用方能把退回原因说出来。 */
  if(arr.length < 2 || !arr.every(isPlainObj)) return {};
  const seen = [], has = new Set();
  for(const o of arr) for(const k of Object.keys(o)) if(!has.has(k)){ has.add(k); seen.push(k); }
  if(!seen.length) return {};
  if(seen.length > TABLE_MAX_COLS) return {tooMany: seen.length};
  return {cols: seen};
}

function renderCell(v){
  const s = renderScalar(v);
  if(s) return s;
  if(v === undefined) return el("span", "empty", "—");     /* 该行没有这一列 */
  if(typeof v === "string") return foldable(v, CELL_FOLD, "cell-str");
  const n = Array.isArray(v) ? v.length : Object.keys(v).length;
  if(!n) return el("span", "empty", Array.isArray(v) ? T("emptyArr") : T("emptyObj"));
  const d = el("details", "node");
  const sum = el("summary");
  sum.appendChild(el("span", "hint",
    Array.isArray(v) ? T("items", {n: fmtN(n)}) : T("keys", {n: n})));
  d.appendChild(sum);
  d.appendChild(renderValue(v, 2));
  return d;
}

function renderArray(arr, depth){
  if(!arr.length) return el("span", "empty", T("emptyArr"));
  const tk = tableKeys(arr);
  const cols = tk.cols;
  if(cols){
    const wrap = el("div", "tbl-wrap");
    const tb = el("table", "tbl");
    const thead = el("thead"), htr = el("tr");
    htr.appendChild(el("th", null, "#"));
    for(const c of cols) htr.appendChild(el("th", null, c));
    thead.appendChild(htr); tb.appendChild(thead);
    const body = el("tbody");
    arr.forEach((o, i) => {
      const tr = el("tr");
      tr.appendChild(el("td", null, String(i)));
      for(const c of cols){
        const td = el("td");
        td.appendChild(renderCell(o[c]));
        tr.appendChild(td);
      }
      body.appendChild(tr);
    });
    tb.appendChild(body); wrap.appendChild(tb);
    return wrap;
  }
  const box = el("div", "body");
  if(tk.tooMany)   /* 退回列表是有原因的，写出来 */
    box.appendChild(el("div", "hint", T("tooManyCols", {n: tk.tooMany, m: TABLE_MAX_COLS})));
  arr.forEach((v, i) => {
    const isBox = (v !== null && typeof v === "object" &&
                   (Array.isArray(v) ? v.length : Object.keys(v).length) > 0);
    if(isBox){
      const d = el("details", "node");
      d.open = depth < 1 && arr.length <= 20;
      d.appendChild(summaryFor("[" + i + "]", v));
      d.appendChild(renderValue(v, depth + 1));
      box.appendChild(d);
    }else{
      const row = el("div", "kv");
      row.appendChild(el("span", "k", "[" + i + "]"));
      row.appendChild(renderValue(v, depth + 1));
      box.appendChild(row);
    }
  });
  return box;
}

/* ===== 外观开关 =====
   写的是**同一对** cookie + localStorage 键，与主界面设置页那个开关是同一个设置的两个入口，
   不是第二个真相源。切换不刷新页面——三套外观全靠 CSS 变量，改 data-theme 就重绘完了。 */
const THEMES = ["classic", "dark", "light"];
const THEME_LABEL = {classic: "thClassic", dark: "thDark", light: "thLight"};
function currentTheme(){
  const t = document.documentElement.dataset.theme || "";
  return THEMES.indexOf(t) >= 0 ? t : "dark";
}
function setTheme(t){
  if(THEMES.indexOf(t) < 0) return;
  document.documentElement.dataset.theme = t;
  document.documentElement.style.colorScheme = (t === "dark" ? "dark" : "light");
  try{
    localStorage.setItem("ccwa_ui_theme", t);
    /* 与主界面 setTheme 逐字同形：端口是动态的，cookie 才跨得过去 */
    document.cookie = "ccwa_ui_theme=" + encodeURIComponent(t) +
      "; Path=/; Max-Age=31536000; SameSite=Strict";
  }catch(e){}
  syncThemeSwitch();
}
function syncThemeSwitch(){
  const cur = currentTheme();
  document.querySelectorAll("#tsw button").forEach(b => {
    b.setAttribute("aria-checked", b.dataset.t === cur ? "true" : "false");
  });
}
function renderThemeSwitch(){
  const box = document.getElementById("tsw");
  box.setAttribute("aria-label", T("thPick"));
  for(const t of THEMES){
    const b = el("button");
    b.dataset.t = t;
    b.type = "button";
    b.setAttribute("role", "radio");
    b.title = T(THEME_LABEL[t]);
    b.setAttribute("aria-label", T(THEME_LABEL[t]));
    b.onclick = () => setTheme(t);
    box.appendChild(b);
  }
  syncThemeSwitch();
}

/* ===== 顶栏 ===== */
function renderHeader(){
  document.getElementById("hTitle").textContent =
    META.mode === "index" ? T("titleIndex") : T("titleView");
  document.title = (META.mode === "index" ? T("titleIndex") : T("titleView")) +
                   " · CC Wire Analyzer";
  document.getElementById("bHome").textContent = T("home");
  document.getElementById("bApp").textContent = T("app");
  const rt = document.getElementById("rt");
  rt.appendChild(el("span", "chip", "v" + RUNTIME.version));
  rt.appendChild(el("span", "chip " + (RUNTIME.recording ? "ok" : ""),
                    RUNTIME.recording ? "● " + T("recOn") : "○ " + T("recOff")));
  rt.appendChild(el("span", "chip", RUNTIME.listen));
  renderThemeSwitch();
}

/* ===== 首页：需要参数的端点 =====
   一行可编辑的完整 URL + 两个按钮。预填的样例由后端从**本机真实数据**里挑
   （`_view_sample_ids`），挑不到才退回参考写法，并在旁边如实标成"参考写法"——
   不标就是在骗人照抄一个跑不通的地址。 */
function epTry(e){
  const wrap = el("div", "ep-try");
  wrap.appendChild(el("span", "chip" + (e.example_real ? " gold" : ""),
                      T(e.example_real ? "exReal" : "exFake")));
  const inp = el("input", "ep-url");
  inp.type = "text";
  inp.value = e.example;                 /* 用户数据走 value，绝不拼进 HTML */
  inp.spellcheck = false;
  inp.setAttribute("aria-label", T("epUrl"));
  const go = (raw) => {
    const u = inp.value.trim();
    if(!u){ toast(T("epEmpty")); return; }
    location.href = raw ? u : u + (u.indexOf("?") < 0 ? "?" : "&") + "format=html";
  };
  inp.onkeydown = (ev) => { if(ev.key === "Enter"){ ev.preventDefault(); go(false); } };
  const b1 = el("button", "btn primary", T("gRender"));
  b1.type = "button"; b1.onclick = () => go(false);
  const b2 = el("button", "btn", T("gRaw"));
  b2.type = "button"; b2.onclick = () => go(true);
  wrap.appendChild(inp); wrap.appendChild(b1); wrap.appendChild(b2);
  return wrap;
}

/* ===== 首页 ===== */
function renderIndex(){
  const main = document.getElementById("main");
  const lead = el("p", "lead");
  lead.innerHTML = L.lead;      /* 自家文案，非用户数据 —— 这里的 innerHTML 是有意的 */
  main.appendChild(lead);

  const groups = {};
  for(const e of ENDPOINTS){ (groups[e.group] = groups[e.group] || []).push(e); }
  const order = ["guide", "captures", "analysis", "snapshots", "proxy", "instance", "other"];
  for(const g of order){
    if(!groups[g]) continue;
    const card = el("div", "card");
    card.appendChild(el("h2", null, (L.grp[g] || g)));
    for(const e of groups[g]){
      const row = el("div", "ep" + ((e.href || e.example) ? "" : " muted"));
      row.appendChild(el("code", "ep-rule", e.rule));
      row.appendChild(el("span", "ep-note", (L.ep[e.note] || "")));
      const act = el("div", "ep-act");
      if(e.href){
        const a = el("a", "btn primary", T("gRender"));
        a.href = e.href; act.appendChild(a);
      }else if(e.no_link){
        act.appendChild(el("span", "ep-why", T(e.no_link)));
      }else if(e.needs_arg && !e.example){
        /* 兜底：将来某个新端点带了 <rid>/<sid> 之外的参数，后端还没给它样例——
           那就照旧说一句"需路径参数"，而不是留一行连原因都没有的空行。 */
        act.appendChild(el("span", "ep-why", T("gNeedArg")));
      }
      if(e.raw){
        const r = el("a", "btn", T("gRaw"));
        r.href = e.raw; act.appendChild(r);
      }
      row.appendChild(act);
      if(e.example) row.appendChild(epTry(e));   /* 需要参数的行：给它一个能填的地方 */
      card.appendChild(row);
    }
    main.appendChild(card);
  }
}

/* ===== payload 页 ===== */
function renderPayload(){
  const main = document.getElementById("main");
  const card = el("div", "card");

  const tool = el("div", "tool");
  const st = META.status >= 500 ? "err" : (META.status >= 400 ? "warn" : "ok");
  tool.appendChild(el("span", "chip " + st, T("status", {n: META.status})));
  tool.appendChild(el("code", "url", META.url));
  tool.appendChild(el("span", "chip", fmtBytes(META.nbytes)));
  if(META.kind === "json" && !META.oversize){
    const ea = el("button", "btn", T("expandAll"));
    ea.onclick = () => document.querySelectorAll("details.node").forEach(d => d.open = true);
    const ca = el("button", "btn", T("collapseAll"));
    ca.onclick = () => document.querySelectorAll("details.node").forEach(d => d.open = false);
    tool.appendChild(ea); tool.appendChild(ca);
  }
  if(!META.oversize){
    const cp = el("button", "btn", T("copy"));
    cp.onclick = () => copyText(META.kind === "json"
      ? JSON.stringify(PAYLOAD, null, 2) : String(PAYLOAD));
    tool.appendChild(cp);
  }
  const raw = el("a", "btn", T("gRaw"));
  raw.href = META.raw;
  tool.appendChild(raw);
  card.appendChild(tool);

  if(META.oversize){
    /* 超限：**说清楚**并给出完整字节的入口。静默截断是这个项目的惯犯 bug ③，
       在一个专门用来看清楚的页面上重犯它，比不做这个页面还糟。 */
    const n = el("div", "notice");
    n.appendChild(el("b", null, T("oversizeT")));
    const p = el("p");
    p.innerHTML = T("oversizeB", {n: fmtBytes(META.oversize), m: fmtBytes(META.maxBytes)});
    n.appendChild(p);
    card.appendChild(n);
  }else if(META.kind === "markdown"){
    /* 说明书是**自家文档**（docs/reference/AI_USAGE.md），所以允许走 markdown。
       即便如此仍过 DOMPurify——产物里这份文件理论上可被替换，而"理论上"在
       一个安全工具里不是放行的理由。 */
    const md = el("div", "md");
    const html = window.marked ? marked.parse(String(PAYLOAD), {mangle: false, headerIds: false})
                               : null;
    if(html && window.DOMPurify) md.innerHTML = DOMPurify.sanitize(html);
    else md.appendChild(el("pre", "str-pre", String(PAYLOAD)));   /* 库没加载就退回纯文本，不裸插 */
    card.appendChild(md);
  }else{
    const tree = el("div", "tree");
    tree.appendChild(renderValue(PAYLOAD, 0));
    card.appendChild(tree);
  }
  main.appendChild(card);
}

renderHeader();
if(META.mode === "index") renderIndex(); else renderPayload();
</script>
</body>
