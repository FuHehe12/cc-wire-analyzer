[project]
name = "cc-wire-analyzer"
version = "0.4.1"
description = "Record and inspect every HTTP request Claude Code makes — a local MITM proxy with a desktop GUI and an agent-drivable HTTP API. Setup is one settings field."
readme = "README.md"
requires-python = ">=3.10"
# 代码 MIT；文档 CC BY 4.0（见 LICENSE）。包元数据按代码协议 MIT。
license = { text = "MIT" }
dependencies = [
    "flask>=3.0",
    "httpx>=0.27",
    "pywebview>=5.0",
    "pyinstaller>=6.0",   # bundling tool kept in main deps so CI/build machines get it on `uv sync`
    # 录制侧解压能力必须覆盖 CC 声明的全部 Accept-Encoding（gzip/deflate/br/zstd）：
    # gzip/deflate 是 Python 标准库，br/zstd 需第三方包（issue 260731：缺 brotli 曾致
    # DeepSeek 对非流式 security 响应的 body 全丢）。两个都是 C 扩展，PyInstaller 打包
    # 时 build.spec 的 hiddenimports 也要带上。
    "brotli>=1.1",
    "zstandard>=0.22",
]

[project.optional-dependencies]
# pywebview 的 macOS 后端依赖 WebKit（pyobjc）；Windows 用 WebView2（系统自带，无需依赖）。
# 用 optional 让 `uv sync` 在 Windows 不装 pyobjc。macOS 构建机 `uv sync --extra mac`。
mac = [
    "pyobjc>=10.0",
]

[tool.uv]
package = false
