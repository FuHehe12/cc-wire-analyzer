<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CC Wire Analyzer · 产品说明书</title>
<style>
:root{--bg:#f7f8fa;--paper:#fff;--ink:#243345;--muted:#586775;--line:#bcc8d1;--blue:#285f92;--wash:#eaf1f8;--green:#27695b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1420px;margin:auto;padding:30px 42px 64px}a{color:var(--blue);text-underline-offset:3px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-bottom:18px;border-bottom:1px solid var(--line)}h1{font-size:25px;font-weight:600;line-height:1.4;margin:0}header p{font-size:13px;margin:4px 0 0;color:var(--muted)}.reference{font-size:13px;white-space:nowrap}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:22px 0}.search{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}input,button{font:inherit;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--ink);min-height:40px;padding:7px 12px}input{min-width:0;width:100%;font-size:14px}button{cursor:pointer;font-size:13px}button:hover{border-color:var(--blue);color:var(--blue)}:focus-visible{outline:3px solid #3c86c4;outline-offset:3px}.status{font-size:12px;color:var(--muted);margin:0 0 20px}.layout{display:grid;grid-template-columns:285px minmax(0,1fr);gap:56px;align-items:start}.origin{position:sticky;top:24px;padding:22px 0}.label{color:var(--blue);font-size:13px}.origin h2{font-size:27px;line-height:1.45;letter-spacing:-.4px;margin:12px 0;font-weight:600}.origin p{font-size:14px;margin:12px 0}.scenario{border-left:3px solid var(--green);padding-left:13px;color:var(--green);margin-top:24px!important}.note{font-size:12px!important;color:var(--muted)}.route{padding-top:12px;border-top:1px solid var(--line);margin-top:20px}.route a{display:block;text-decoration:none;font-size:13px;padding:3px 0}.tree{border-left:1px solid var(--line);padding-left:26px;min-width:0}.branch{position:relative;margin-bottom:18px;background:var(--paper);border-radius:5px;min-width:0}.branch:before{content:"";position:absolute;width:27px;height:1px;background:var(--line);left:-27px;top:28px}.branch>summary{list-style:none;padding:15px 18px;display:flex;gap:12px;align-items:center;cursor:pointer}.branch>summary::-webkit-details-marker{display:none}.step{font:13px Consolas,monospace;color:var(--muted);width:23px;flex-shrink:0}.branch-title{font-size:17px;font-weight:600;flex:1}.toggle{color:var(--blue);font-size:19px}.branch .toggle:before{content:"+"}.branch[open] .toggle:before{content:"−"}.content{padding:0 20px 18px 53px}.body{color:var(--muted);font-size:14px;margin:0 0 13px;overflow-wrap:anywhere}.children{border-left:1px solid var(--line);padding-left:16px}.node{position:relative;padding-bottom:8px;margin-bottom:5px;min-width:0}.node:before{content:"";position:absolute;width:17px;height:1px;background:var(--line);left:-17px;top:18px}.node>summary{cursor:pointer;font-size:15px;font-weight:500;padding:5px 0;overflow-wrap:anywhere}.node>.content{padding:4px 0 7px 12px}.node .body{font-size:14px}.refs{display:flex;flex-wrap:wrap;gap:5px;font-size:12px;align-items:baseline;margin:10px 0;color:var(--muted)}.ref{font-size:12px;min-height:30px;padding:3px 7px;border:none;background:var(--wash);color:var(--blue);text-align:left;white-space:normal;overflow-wrap:anywhere}.highlight{outline:2px solid var(--blue);outline-offset:5px}.empty{padding:30px;color:var(--muted)}footer{border-top:1px solid var(--line);margin-top:28px;padding-top:18px;font-size:12px;color:var(--muted)}.downloads{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;margin-bottom:12px}[hidden]{display:none!important}@media(max-width:900px){main{padding:22px 18px 40px}.layout{grid-template-columns:1fr;gap:20px}.origin{position:static;padding:0}.origin h2{font-size:25px}.origin .route{display:none}.origin p{max-width:720px}.scenario{margin-top:15px!important}.tree{padding-left:16px}.branch:before{width:17px;left:-17px}.content{padding-left:24px;padding-right:14px}.branch>summary{padding:12px;gap:6px}.branch-title{font-size:16px}.branch:before{top:26px}header{align-items:start}.reference{white-space:normal;max-width:120px}.search{flex-basis:100%}.toolbar button{flex:1}.node>.content{padding-left:5px}.children{padding-left:12px}.node:before{width:13px;left:-13px}}@media print{.toolbar,.reference,.route,.downloads{display:none}.layout{display:block}.origin{position:static}.tree{margin-top:20px}.branch{break-inside:avoid}body{background:#fff}.content{font-size:12px}}
.search{white-space:nowrap}.origin:after{content:"";position:absolute;right:-56px;top:28px;width:56px;height:1px;background:var(--line)}@media(max-width:900px){.origin:after{display:none}}
.body{white-space:pre-line}.kind{display:inline-block;font-size:11px;font-weight:400;color:var(--blue);background:var(--wash);border-radius:3px;padding:1px 5px;margin-left:5px}.node[data-catalog]>summary{font-weight:400}
@media(max-width:900px){.toolbar button{flex:1 1 105px;white-space:nowrap}.content{padding-left:14px}.node>.content{padding-left:0}.children{padding-left:8px}.node:before{width:9px;left:-9px}}
.body{white-space:normal}.body p{margin:8px 0 12px}.body h3,.body h4{font-size:15px;margin:16px 0 8px}.body table{display:block;max-width:100%;overflow:auto;border-collapse:collapse;font-size:13px}.body td,.body th{border-bottom:1px solid var(--line);padding:7px;text-align:left;min-width:80px}.body pre{max-width:100%;overflow:auto;background:var(--wash);padding:12px;border-radius:4px;font-size:12px;white-space:pre}.body code{overflow-wrap:anywhere}.evidence-shot{margin:18px 0;min-width:0}.shot-button{display:block;max-width:100%;width:100%;padding:0;overflow:hidden;line-height:0}.shot-button img{display:block;width:100%;height:auto}.shot-button span{display:block;line-height:1.7;padding:6px}.evidence-shot figcaption{font-size:12px;color:var(--muted);overflow-wrap:anywhere;margin-top:8px}dialog{width:min(96vw,1600px);max-width:96vw;max-height:94vh;padding:18px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);overflow:auto}dialog::backdrop{background:#172333b3}.dialog-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.dialog-toolbar button{flex-shrink:0}#imageNote{font-size:13px}#fullImage{display:block;width:100%;height:auto;margin-top:12px}#evidence[aria-pressed=true]{background:var(--wash);border-color:var(--blue)}
/* V3 uses the available desktop width, including deeply expanded branches. */
@media(min-width:901px){
  body.wide-reader main{max-width:none;width:100%;padding-inline:clamp(24px,2vw,64px)}
  body.wide-reader .layout{grid-template-columns:260px minmax(0,1fr);gap:28px}
  body.wide-reader .origin:after{right:-28px;width:28px}
  body.wide-reader .branch>.content{padding-left:24px}
  body.wide-reader .node>.content{padding-left:4px}
  body.wide-reader .children{padding-left:10px}
  body.wide-reader .node:before{width:11px;left:-11px}
}
.annotated-shot{position:relative;display:block}.annotated-shot>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.callout-key{list-style:none;padding:0;margin:10px 0;display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--ink)}.callout-key li{display:flex;gap:8px;align-items:baseline}.callout-key b{display:inline-grid;place-items:center;background:#bf3325;color:white;border-radius:50%;min-width:24px;height:24px;font:600 13px sans-serif}.modal-shot{margin-top:12px}.modal-shot #fullImage{margin-top:0}
</style></head><body><main>
<header><div><h1 id="heading"></h1><p id="subtitle"></p></div><a class="reference" href="#book-documents">阅读说明与开发参考</a></header>
<div class="toolbar"><label class="search">查找<input type="search" id="search" placeholder="例如：调查、截图、恢复、C-04"></label><button id="overview">只看主干</button><button id="mainLevel">展开主要层</button><button id="details">展开具体条目</button><button id="all">展开全部</button><button id="manual" aria-pressed="false">使用方法</button><button id="evidence" aria-pressed="false">实际实现与截图</button><button id="reset">重置</button></div>
<p class="status" id="result" role="status" aria-live="polite"></p>
<div class="layout"><aside class="origin"><div class="label" id="contextLabel"></div><h2 id="productTitle"></h2><p id="position"></p><p class="scenario" id="scenario"></p><p class="note" id="contextNote"></p><nav class="route" aria-label="需求推导顺序" id="route"></nav></aside><section class="tree" aria-label="产品定位与需求思维导图" id="tree"></section></div>
<footer><div class="downloads"><a href="AI_产品定义与需求推导.md" download>产品定义 · Markdown</a><a href="AI_新产品需求导图.opml" download>新产品导图 · OPML</a><a href="product-expanded.json" download>完整产品树 · JSON</a></div><p id="reading"></p><p id="planningDocs" hidden><a href="AI_历史决策复核.md">历史依据</a> · <a href="AI_存量矛盾裁定.md">冲突裁定记录</a></p><p id="buildNote"></p></footer>
</main><dialog id="imageDialog" aria-labelledby="imageTitle"><div class="dialog-toolbar"><strong id="imageTitle"></strong><button id="closeImage" type="button">关闭大图</button></div><p id="imageNote"></p><a id="originalImage" target="_blank" rel="noopener">单独打开原图</a><img id="fullImage" alt=""></dialog><script src="assets/vendor/marked.min.js"></script><script src="assets/vendor/purify.min.js"></script><script id="data" type="application/json">__PRODUCT_JSON__</script><script>
'use strict';const data=JSON.parse(document.getElementById('data').textContent);const $=id=>document.getElementById(id);let onlyEvidence=false,onlyManual=false;const index=new Map();function collect(ns){ns.forEach(n=>{index.set(n.id,n);collect(n.children)})}collect(data.tree);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const presentation=data.presentation;$('heading').textContent=presentation.heading;$('subtitle').textContent=presentation.subtitle;$('contextLabel').textContent=presentation.label;$('contextNote').textContent=presentation.note;$('reading').textContent=presentation.reading;$('buildNote').textContent='数据：data/product-'+data.version+'.json；生成：python tools/build_product.py '+data.version+'。实际实现与截图按各自证据基线维护。';document.title=data.title;$('evidence').hidden=!data.evidenceCount;$('manual').hidden=!data.manualCount;$('planningDocs').hidden=data.version!=='v3';
const titleOf=n=>n.title.replace(/^\d+\.\s*/,'');const stepOf=i=>data.version==='v3'?i:i+1;
const prose=text=>DOMPurify.sanitize(marked.parse(text,{breaks:true}),{FORBID_TAGS:['img','iframe','style','script']});
const shotMap=new Map();index.forEach(n=>(n.images||[]).forEach(i=>shotMap.set(i.src,i)));
function annotations(i){if(!i.callouts?.length)return '';return `<svg viewBox="0 0 ${i.width} ${i.height}" aria-hidden="true">${i.callouts.map((c,k)=>`<rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="7" fill="none" stroke="white" stroke-width="6"/><rect x="${c.x}" y="${c.y}" width="${c.w}" height="${c.h}" rx="7" fill="none" stroke="#bf3325" stroke-width="3"/><circle cx="${Math.max(15,c.x)}" cy="${Math.max(15,c.y)}" r="14" fill="#bf3325" stroke="white" stroke-width="2"/><text x="${Math.max(15,c.x)}" y="${Math.max(15,c.y)+5}" text-anchor="middle" fill="white" font-family="sans-serif" font-size="15" font-weight="700">${k+1}</text>`).join('')}</svg>`;}
function calloutKey(i){return i.callouts?.length?'<ol class="callout-key">'+i.callouts.map((c,k)=>'<li><b>'+(k+1)+'</b>'+esc(c.text)+'</li>').join('')+'</ol>':'';}
function media(n){return (n.images||[]).map(i=>'<figure class="evidence-shot"'+(i.width?' style="max-width:'+i.width+'px"':'')+'><button type="button" class="shot-button" data-image="'+esc(i.src)+'" aria-label="放大：'+esc(i.title)+'"><div class="annotated-shot"><img loading="lazy" src="'+esc(window.bookAsset?bookAsset(i.src):i.src)+'" alt="'+esc(i.title)+'">'+annotations(i)+'</div><span>查看大图'+(i.callouts?.length?'与标注':'')+'</span></button><figcaption><strong>'+esc(i.title)+'</strong><br>'+esc(i.note)+calloutKey(i)+'来源：'+esc(i.originalSource)+'</figcaption></figure>').join('');}
$('productTitle').textContent=data.title;$('position').textContent=data.position;$('scenario').textContent=data.firstScenario;
$('route').innerHTML=data.tree.map((n,i)=>`<a href="#${n.id}" data-go="${n.id}">${stepOf(i)}. ${esc(titleOf(n))}</a>`).join('');
function relevant(n,q){return (((!onlyEvidence||n.implementation||n.evidenceCode)&&(!onlyManual||n.manual))&&(!q||[n.title,n.body,n.id].join(' ').toLowerCase().includes(q)))||n.children.some(c=>relevant(c,q))}
function node(n,depth,q,i=0,inherited=false){const self=((!onlyEvidence||n.implementation||n.evidenceCode)&&(!onlyManual||n.manual))&&!!q&&[n.title,n.body,n.id].join(' ').toLowerCase().includes(q);const children=n.children.filter(c=>inherited||self||relevant(c,q));return `<details id="${n.id}" data-depth="${depth}" class="${depth===0?'branch':'node'}" ${n.catalogId?'data-catalog="'+n.catalogId+'"':''} ${q||onlyEvidence||onlyManual?'open':''}><summary>${depth===0?`<span class="step">${String(stepOf(i)).padStart(2,'0')}</span><span class="branch-title">${esc(titleOf(n))}</span><span class="toggle" aria-hidden="true"></span>`:esc(n.title)+(n.itemType?` <span class="kind">${esc(n.itemType)}</span>`:'')}</summary><div class="content"><div class="body">${prose(n.body)}</div>${media(n)}${n.basis?`<button type="button" class="ref" data-basis="${n.id}-basis" aria-expanded="false">来源与设计依据</button><div id="${n.id}-basis" class="body" hidden>${prose(n.basis)}</div>`:""}${n.refs?.length?`<div class="refs">相关内容：${n.refs.map(r=>`<button type="button" class="ref" data-go="${r}">${esc(index.get(r).title)}</button>`).join('')}</div>`:''}${children.length?`<div class="children">${children.map(c=>node(c,depth+1,q,0,inherited||self)).join('')}</div>`:''}</div></details>`}
function render(){const q=$('search').value.trim().toLowerCase();const visible=data.tree.filter(n=>relevant(n,q));$('tree').innerHTML=visible.length?visible.map(n=>node(n,0,q,data.tree.indexOf(n))).join(''):'<p class="empty">没有匹配的内容。换个关键词，或点击“重置”。</p>';$('result').textContent=q?`找到 ${visible.length} 个相关主干，匹配路径已展开。`:`${data.tree.length} 个工作流主干 · ${data.detailCount} 项条目${data.evidenceCount?' · '+data.evidenceCount+' 处实现说明 / '+data.screenshotCount+' 张截图':''}`;}
function depth(level){document.querySelectorAll('#tree details').forEach(el=>el.open=Number(el.dataset.depth)<level)}
function go(id){if(!document.getElementById(id)){$('search').value='';onlyManual=false;$('manual').setAttribute('aria-pressed','false');onlyEvidence=false;$('evidence').setAttribute('aria-pressed','false');render()}const el=document.getElementById(id);if(!el)return;let parent=el;while(parent){if(parent.tagName==='DETAILS')parent.open=true;parent=parent.parentElement}document.querySelectorAll('.highlight').forEach(e=>e.classList.remove('highlight'));el.classList.add('highlight');el.scrollIntoView({block:'center',behavior:'instant'});el.querySelector('summary').focus();}
document.addEventListener('click',e=>{const target=e.target.closest('[data-go]');if(target){e.preventDefault();go(target.dataset.go)}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-basis]');if(!b)return;const panel=document.getElementById(b.dataset.basis);panel.hidden=!panel.hidden;b.setAttribute('aria-expanded',String(!panel.hidden))});
$('search').addEventListener('input',render);$('overview').onclick=()=>depth(0);$('mainLevel').onclick=()=>depth(1);$('details').onclick=()=>document.querySelectorAll('#tree details').forEach(el=>el.open=!el.hasAttribute('data-catalog'));$('all').onclick=()=>depth(99);$('manual').onclick=()=>{onlyManual=!onlyManual;onlyEvidence=false;$('evidence').setAttribute('aria-pressed','false');$('manual').setAttribute('aria-pressed',String(onlyManual));render()};$('evidence').onclick=()=>{onlyManual=false;$('manual').setAttribute('aria-pressed','false');onlyEvidence=!onlyEvidence;$('evidence').setAttribute('aria-pressed',String(onlyEvidence));render()};$('reset').onclick=()=>{$('search').value='';onlyManual=false;$('manual').setAttribute('aria-pressed','false');onlyEvidence=false;$('evidence').setAttribute('aria-pressed','false');render()};
document.addEventListener('click',e=>{const b=e.target.closest('[data-image]');if(!b)return;const shot=shotMap.get(b.dataset.image);if(!shot)return;$('imageTitle').textContent=shot.title;$('imageNote').textContent=shot.note;const img=$('fullImage');img.src=window.bookAsset?bookAsset(shot.src):shot.src;img.alt=shot.title;$('originalImage').href=img.src;let frame=img.parentElement;if(!frame.classList.contains('modal-shot')){frame=document.createElement('div');frame.className='annotated-shot modal-shot';img.replaceWith(frame);frame.append(img);}frame.querySelector('svg')?.remove();frame.insertAdjacentHTML('beforeend',annotations(shot));$('modalKey')?.remove();frame.insertAdjacentHTML('afterend','<div id="modalKey">'+calloutKey(shot)+'</div>');$('imageDialog').showModal()});
$('closeImage').onclick=()=>$('imageDialog').close();render();
</script></body></html>
