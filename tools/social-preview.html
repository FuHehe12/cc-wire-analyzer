<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>CC Wire Analyzer social preview source</title>
  <style>
    @font-face { font-family: Inter; src: url("../src/static/fonts/Inter.ttf"); }
    @font-face { font-family: Mono; src: url("../src/static/fonts/JetBrainsMono.ttf"); }
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 640px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      background:
        radial-gradient(circle at 15% 15%, rgb(232 174 55 / 0.13), transparent 390px),
        radial-gradient(circle at 88% 10%, rgb(75 192 204 / 0.1), transparent 360px),
        #111116;
      color: #f4f1e9;
      font-family: Inter, sans-serif;
    }
    body::before {
      position: absolute; inset: 0;
      background-image: linear-gradient(rgb(255 255 255 / .025) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .025) 1px, transparent 1px);
      background-size: 34px 34px;
      content: "";
    }
    .brand { position: absolute; top: 52px; left: 66px; display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 820; }
    .mark { position: relative; width: 38px; height: 38px; border: 1px solid #62532f; border-radius: 10px; background: #201c13; }
    .mark::before { position: absolute; top: 10px; right: 7px; left: 7px; height: 3px; background: #e8ae37; box-shadow: 0 8px 0 #4bc0cc, 0 16px 0 #ae7de0; content: ""; }
    .copy { position: absolute; z-index: 2; top: 150px; left: 66px; width: 630px; }
    .label { margin-bottom: 19px; color: #f3c35f; font: 700 14px Mono, monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 64px; line-height: .99; letter-spacing: -.055em; }
    h1 span { color: #f3c35f; }
    p { width: 585px; margin: 24px 0 0; color: #aaa7b1; font-size: 22px; line-height: 1.45; }
    .facts { display: flex; gap: 20px; margin-top: 31px; color: #aaa7b1; font: 12px Mono, monospace; }
    .facts span::before { display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: #5bd58b; content: ""; }
    .screen { position: absolute; right: -105px; bottom: -80px; width: 680px; height: 495px; overflow: hidden; border: 1px solid #41414c; border-radius: 22px; background: #1b1b23; box-shadow: 0 28px 80px rgb(0 0 0 / .55); transform: rotate(-2.8deg); }
    .screen img { width: 820px; max-width: none; height: auto; }
    .rail { position: absolute; z-index: 3; right: 516px; bottom: 116px; width: 200px; height: 2px; background: linear-gradient(90deg, #e8ae37, #4bc0cc); }
    .rail::before, .rail::after { position: absolute; top: -6px; width: 14px; height: 14px; border-radius: 50%; content: ""; }
    .rail::before { left: 0; background: #e8ae37; }
    .rail::after { right: 0; background: #4bc0cc; box-shadow: 0 0 24px #4bc0cc; }
    .route { position: absolute; z-index: 4; right: 535px; bottom: 137px; color: #7f7c88; font: 11px Mono, monospace; }
  </style>
</head>
<body>
  <div class="brand"><span class="mark" aria-hidden="true"></span>CC Wire Analyzer</div>
  <div class="copy">
    <div class="label">Local wire-level observability</div>
    <h1>See what Claude Code actually sends <span>over the wire.</span></h1>
    <p>Inspect full HTTP requests, system prompts, tools, SSE timing, upstream errors and exact token usage.</p>
    <div class="facts"><span>Windows + macOS</span><span>Local only</span><span>Open source</span></div>
  </div>
  <div class="rail" aria-hidden="true"></div>
  <div class="route">Claude Code → local inspector → upstream</div>
  <div class="screen"><img src="../docs/screenshots/en/view-d-dag.png" alt=""></div>
</body>
</html>
