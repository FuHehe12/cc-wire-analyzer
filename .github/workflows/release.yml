name: manual-verify-build

# 公开披露已冻结：仅显式手动验证与打包，不触发发布。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 260808 新增。此前这个 workflow 从 checkout 直接到 PyInstaller 再到发 release，
  # **中间没有任何验证**——一次没跑过自测的 tag 可以直接产出 release。
  #
  # 为什么跑在 windows-latest 而不是更快的 ubuntu：这批自测（尤其 cli_selftest 真起 daemon、
  # 真 patch/restore settings.json）只在 Windows 上有实证，项目一直在 Windows 上开发。
  # 换平台省几分钟、换来一个从没跑通过的环境，第一次发版就会红在与代码无关的地方。
  # 要上 Linux 应该单独做一次验证再改，不该顺手夹带在闸门这件事里。
  verify:
    name: Verify (self-tests + doc gate)
    runs-on: windows-latest
    # 显式 bash 让多命令 step 中任意一条失败立即停止。
    # Actions 在 pwsh 下只把**最后一条命令**的 `$LASTEXITCODE` 当作 step 结果。
    #      下面两个 step 各有 4~6 行命令，那意味着前面几条全失败、只要最后一条成功，
    #      step 就是绿的 —— **闸门会在 CI 里静默失效**，而这正是它要防的病。
    #      bash 由 Actions 以 `-eo pipefail` 启动，第一条失败就停。
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        run: uv sync

      # 顺序有意：先语法、再静态对账（秒级，失败得最快）、最后跑真起进程的 e2e 自测。
      - name: Syntax
        run: uv run python -m compileall -q src tests tools

      - name: Build local manual linked from README
        run: uv run python tools/build/build_manual.py

      # doc_audit 是**闸门**：文档说了代码里不成立的事就退出 1（幽灵端点/断链/过期 IDX_SCHEMA/
      # 不存在的自测文件/缺取值的 token）。「代码有、文档没写」只提示，不挡——否则第一个
      # 有意不公开的内部端点就会卡住发版。判据见 tools/checks/doc_audit.py 的 _rows()。
      - name: Static reconciliation
        run: |
          uv run python tools/checks/doc_audit.py --self-test
          uv run python tools/checks/doc_audit.py
          uv run python tools/checks/check_i18n_js.py
          uv run python tools/checks/check_render.py
          uv run python tools/checks/check_refs.py

      - name: Self-tests
        run: |
          uv run python src/settings_guard.py --self-test
          uv run python src/upstream_history.py --self-test
          uv run python tests/proxy_selftest.py
          uv run python tests/cli_selftest.py
          uv run python tests/doctor_selftest.py
          uv run python tests/diagnose_selftest.py
          uv run python tests/snapshot_selftest.py
          uv run python tests/update_selftest.py
          uv run python tests/pack_selftest.py
          uv run python tests/view_selftest.py
          uv run python tests/llm_selftest.py
          uv run python tests/rolling_selftest.py

  build:
    name: Build (${{ matrix.os }})
    needs: verify        # fail-fast：验证不过就不进 PyInstaller，更不会产出 release
    strategy:
      fail-fast: false   # 一个平台失败不影响另一个
      matrix:
        include:
          # 产物名从 260808 起带版本号（`cc-wire-analyzer-v0.4.11-windows.exe`）：下载目录里
          # 躺着的就是文件名，而属性页要点三下。所以这里用通配，具体名字在重命名步骤里拼。
          - os: windows-latest
            spec: build.spec
            extra: ''
            artifact: dist/cc-wire-analyzer-v*-windows.exe
          - os: macos-latest
            spec: build-mac.spec
            extra: '--extra mac'   # 装 pyobjc（macOS WebKit 后端）
            artifact: dist/cc-wire-analyzer-v*-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync ${{ matrix.extra }}

      # 版本号唯一真源是 git tag（见 docs/development/开发约定.md 第九节）。构建前从 tag 生成 src/_version.py，
      # exe 运行时 /api/about 因此永远与 tag 一致；顺带同步 pyproject.toml（仅改 CI 工作副本，不入仓库）。
      # workflow_dispatch 无 tag 时用 0.0.0-dev 兜底（测试构建，不出 release）。
      - name: Inject version from tag
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="0.0.0-dev"
          fi
          printf 'VERSION = "%s"  # CI 从 tag 注入，勿手改（见 docs/development/开发约定.md 第九节）\n' "$V" > src/_version.py
          sed -i.bak "s/^version = \".*\"/version = \"$V\"/" pyproject.toml && rm pyproject.toml.bak
          # 后面的重命名步骤要用它拼产物名。两份 spec 也读同一个 _version.py 刻进
          # PE 版本资源 / Info.plist（tools/build/version_res.py），所以"文件名说的"和
          # "属性页说的"必然是同一个数——它们来自同一个源，不是两处各写一次。
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "Injected version: $V"

      # 单 exe（260713 合并）：无参/双击开 GUI，`serve` 起 headless 服务给 AI，`--help` 打印说明。
      # 不再单独出 CLI 二进制——AI 走 HTTP API（/api/proxy/*、/api/captures…），
      # 结构化 JSON 比 stdout 更合适，也免得维护第二套面向 agent 的接口。
      # （别写"noconsole 没有 stdout"——260801 实测：管道/重定向启动时 fd 1 有效，
      #   `--help` 正是靠这个打印的。见 docs/development/开发约定.md「单 exe，三种调用」。）
      - name: Build with PyInstaller
        run: uv run pyinstaller ${{ matrix.spec }} --noconfirm --clean

      # macOS：把 .app 打成 zip（.app 是目录，artifact/release 需单文件）
      # ditto --sequesterRsrc --keepParent 保留资源分支与目录结构（普通 zip 会丢）
      # 命名（260730）：双平台统一 kebab + 完整 OS 名 —— 原为 CCWireAnalyzer-mac.zip，
      # 与 Windows 侧的 cc-wire-analyzer-windows.exe 看着像两个项目的产物。
      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --sequesterRsrc --keepParent cc-wire-analyzer.app "cc-wire-analyzer-v${APP_VERSION}-macos.zip"

      - name: Rename Windows exe
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/cc-wire-analyzer.exe "dist/cc-wire-analyzer-v${APP_VERSION}-windows.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: ${{ matrix.artifact }}
          if-no-files-found: error   # 产物缺失则构建失败，不静默放过
